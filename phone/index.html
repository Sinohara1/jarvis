<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161616">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Джарвис</title>
<style>
  :root { color-scheme: dark; --fg:#f2f2f2; --dim:#9a9a9a; --line:rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #161616; color: var(--fg);
    font-family: "Segoe UI", Manrope, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: rgba(255,255,255,.08); border: 0; border-radius: 12px; padding: 10px 12px; }
  button.primary { background: #f3f3f3; color: #111; font-weight: 700; }
  input, textarea { width: 100%; background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  #app { min-height: 100%; display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom)); }
  h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -.4px; }
  .dim { color: var(--dim); font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; }
  .tabs button.on { background: #f3f3f3; color: #111; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { white-space: pre-wrap; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); line-height: 1.4; }
  .msg.user { background: rgba(255,255,255,.12); }
  .compose { display: flex; gap: 8px; margin-top: 10px; }
  .compose textarea { min-height: 48px; flex: 1; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; background: rgba(255,255,255,.03); }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .t { font-weight: 700; } .s { color: var(--dim); font-size: 12px; }
  .err { color: #f0b4b4; }
  .pin { font-size: 32px; letter-spacing: 6px; font-weight: 800; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
